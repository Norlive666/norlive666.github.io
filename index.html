<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Norlive | 典雅书卷与资源阁</title>
  <style>
    :root {
      --bg-paper: #fbf8f3;
      --card-bg: #fffdf9;
      --card-inner: #f7f3ec;
      --border-color: #e5ded3;
      --border-hover: #c4b5a0;
      --text-main: #2b2520;
      --text-muted: #796f64;
      --accent: #9a3412;
      --accent-hover: #7c2d12;
      --accent-subtle: #fbf3ee;
      --card-shadow: 0 4px 20px rgba(78, 62, 45, 0.05);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: Georgia, "Songti SC", "Noto Serif SC", "Source Han Serif SC", "STSong", "Hiragino Mincho ProN", serif;
      background-color: var(--bg-paper);
      min-height: 100vh;
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 56px 20px 40px;
      line-height: 1.7;
    }

    /* 整体容器 */
    .container {
      width: 100%;
      max-width: 680px;
      display: flex;
      flex-direction: column;
      gap: 32px;
    }

    /* 顶部主卡片：书卷印章质感 */
    .profile-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 42px 32px;
      text-align: center;
      box-shadow: var(--card-shadow);
      position: relative;
    }

    /* 头像区域 */
    .avatar-wrapper {
      position: relative;
      width: 88px;
      height: 88px;
      margin: 0 auto 20px;
    }

    .avatar {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 3px solid #f2ece1;
      box-shadow: 0 6px 16px rgba(60, 48, 35, 0.08);
      object-fit: cover;
      background-color: #eee7dc;
    }

    .name {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 1px;
      margin-bottom: 8px;
      color: var(--text-main);
    }

    .bio {
      color: var(--text-muted);
      font-size: 15px;
      max-width: 440px;
      margin: 0 auto 24px;
      letter-spacing: 0.5px;
    }

    /* 按钮组 */
    .action-links {
      display: flex;
      justify-content: center;
      gap: 12px;
    }

    .btn {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 18px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      text-decoration: none;
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .btn-primary {
      background: var(--accent);
      color: #fffdf9;
      border: 1px solid var(--accent);
    }

    .btn-primary:hover {
      background: var(--accent-hover);
      border-color: var(--accent-hover);
      transform: translateY(-1px);
    }

    .btn-outline {
      background: var(--card-inner);
      color: var(--text-main);
      border: 1px solid var(--border-color);
    }

    .btn-outline:hover {
      background: #eee8dc;
      border-color: var(--border-hover);
      transform: translateY(-1px);
    }

    /* 分类标题 */
    .section-title {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
      color: var(--text-main);
      padding-left: 2px;
    }

    .section-title svg {
      color: var(--accent);
    }

    /* 资源列表 */
    .resource-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .resource-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 20px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: var(--card-shadow);
      transition: all 0.25s ease;
    }

    .resource-card:hover {
      border-color: var(--border-hover);
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(78, 62, 45, 0.08);
    }

    .resource-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .icon-box {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      background: var(--accent-subtle);
      border: 1px solid #fae4d7;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent);
      flex-shrink: 0;
    }

    .resource-title {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 4px;
      color: var(--text-main);
    }

    .resource-desc {
      font-size: 13px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .badge {
      display: inline-block;
      padding: 1px 7px;
      border-radius: 4px;
      background: var(--card-inner);
      border: 1px solid var(--border-color);
      font-size: 11px;
      font-weight: 500;
      color: var(--text-muted);
    }

    .download-action {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      border-radius: 6px;
      background: var(--accent);
      color: #fffdf9;
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }

    .download-action:hover {
      background: var(--accent-hover);
      transform: scale(1.02);
    }

    /* 卷首寄语 / 关于 */
    .note-card {
      background: var(--card-bg);
      border: 1px dashed var(--border-color);
      border-radius: 14px;
      padding: 20px 24px;
      font-size: 14px;
      color: var(--text-muted);
      line-height: 1.8;
      box-shadow: var(--card-shadow);
    }

    .note-card strong {
      color: var(--accent);
      font-weight: 600;
    }

    /* 页脚 */
    footer {
      text-align: center;
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 10px;
      letter-spacing: 0.5px;
    }

    /* 复制 Toast */
    #toast {
      position: fixed;
      bottom: 28px;
      background: var(--text-main);
      color: #fffdf9;
      padding: 10px 22px;
      border-radius: 20px;
      font-size: 13px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.3s ease;
      pointer-events: none;
      z-index: 100;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    #toast.show {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- 个人名片 -->
    <div class="profile-card">
      <div class="avatar-wrapper">
        <img class="avatar" src="https://avatars.githubusercontent.com/Norlive666" alt="Norlive 头像">
      </div>
      <h1 class="name">Norlive</h1>
      <p class="bio">「纸墨寄怀，以文会友」· 记录技术实践、生活杂感与公开资源收藏。</p>
      
      <div class="action-links">
        <a class="btn btn-primary" href="https://github.com/Norlive666" target="_blank" rel="noopener">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"></path></svg>
          GitHub 阁
        </a>
        <button class="btn btn-outline" onclick="copyShareLink()">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg>
          分享斋址
        </button>
      </div>
    </div>

    <!-- 资源典藏专区 -->
    <div>
      <div class="section-title">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
        公共资源与藏本下载
      </div>

      <div class="resource-list">
        <!-- 资源卡片 1 -->
        <div class="resource-card">
          <div class="resource-left">
            <div class="icon-box">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
            </div>
            <div>
              <div class="resource-title">项目开卷指南 (README)</div>
              <div class="resource-desc">
                <span>仓库原初记述</span>
                <span class="badge">MD 纯文本</span>
                <span class="badge">直接下载</span>
              </div>
            </div>
          </div>
          <a class="download-action" href="README.md" download>
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
            取阅
          </a>
        </div>

        <!-- 资源卡片 2 -->
        <div class="resource-card">
          <div class="resource-left">
            <div class="icon-box">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="21 8 21 21 3 21 3 8"></polyline><rect x="1" y="3" width="22" height="5"></rect><line x1="10" y1="12" x2="14" y2="12"></line></svg>
            </div>
            <div>
              <div class="resource-title">实用工具与资源卷宗</div>
              <div class="resource-desc">
                <span>绿色即用便携包</span>
                <span class="badge">ZIP 归档</span>
                <span class="badge">待载入</span>
              </div>
            </div>
          </div>
          <a class="download-action" href="#" onclick="alert('请在仓库中上传您的压缩包，并将本卡片的链接替换为对应文件！')">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
            取阅
          </a>
        </div>
      </div>
    </div>

    <!-- 斋志说明 -->
    <div class="note-card">
      📜 <strong>斋志：</strong> 此阁依托 <strong>GitHub Pages</strong> 结庐而建，免除伺服器修葺之累。往后凡有良卷、新件欲飨同好，径投仓廪，便可在此列席供众人随时查阅下载。
    </div>

    <!-- 页脚 -->
    <footer>
      <p>岁在丙午 · Norlive · 谨制于 GitHub Pages</p>
    </footer>
  </div>

  <div id="toast">📜 斋址已录入剪贴板</div>

  <script>
    function copyShareLink() {
      navigator.clipboard.writeText(window.location.href).then(() => {
        const toast = document.getElementById('toast');
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2000);
      }).catch(() => {
        alert('主页网址：' + window.location.href);
      });
    }
  </script>
</body>
</html>
