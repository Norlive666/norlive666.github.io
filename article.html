<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>文章阅读 | T大帅的个人博客</title>
  <style>
    :root {
      --bg: #ffffff;
      --bg-soft: #fafafa;
      --ink: #111111;
      --ink-soft: #555555;
      --muted: #8a8a8a;
      --line: #e8e8e8;
      --accent: #d92b2b;
      --accent-soft: #fdf2f2;
      /* 兼容模板内联样式里的旧变量 */
      --text-main: var(--ink);
      --text-muted: var(--muted);
      --border-color: var(--line);
      --sans: "Inter", "Helvetica Neue", -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
      --serif: "Noto Serif CJK SC", "Songti SC", Georgia, "Times New Roman", serif;
      --mono: ui-monospace, SFMono-Regular, Menlo, "JetBrains Mono", "Noto Sans Mono CJK SC", monospace;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    ::selection { background: var(--ink); color: #fff; }

    body {
      font-family: var(--sans);
      background: var(--bg);
      color: var(--ink);
      line-height: 1.7;
      padding: 0 22px 64px;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }

    .container { width: 100%; max-width: 760px; margin: 0 auto; }

    /* ── 顶部导航 ── */
    .top-nav {
      position: sticky; top: 0; z-index: 30;
      display: flex; align-items: center; justify-content: space-between; gap: 14px;
      padding: 14px 0; margin-bottom: 8px;
      background: rgba(255, 255, 255, 0.92); backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--line);
      font-size: 12px; color: var(--muted);
    }
    .back-btn {
      display: inline-flex; align-items: center; gap: 7px;
      font-family: var(--mono); font-size: 11px; letter-spacing: 0.06em; color: var(--ink);
      padding: 5px 0; border-bottom: 1px solid transparent; transition: 0.18s ease;
    }
    .back-btn:hover { color: var(--accent); border-bottom-color: var(--accent); }
    .top-nav span[style] { font-family: var(--mono) !important; font-size: 10px !important; letter-spacing: 0.08em !important; }

    /* ── 文章头 ── */
    .article-box { padding: 34px 0 0; }
    .meta-bar {
      display: flex; align-items: center; flex-wrap: wrap; gap: 10px;
      font-family: var(--mono); font-size: 10px; letter-spacing: 0.08em; color: var(--muted);
    }
    .badge {
      font-family: var(--mono); font-size: 10px; letter-spacing: 0.12em; color: var(--accent);
      text-transform: uppercase;
    }
    .article-header { padding: 16px 0 26px; border-bottom: 1px solid var(--ink); margin-bottom: 30px; }
    .article-header h1 {
      font-size: clamp(26px, 3.8vw, 38px);
      line-height: 1.24; letter-spacing: -0.03em; font-weight: 800;
    }

    /* ── 正文排版 ── */
    .content { font-family: var(--serif); font-size: 16px; line-height: 1.95; color: #333333; }
    .content h1, .content h2, .content h3 {
      font-family: var(--sans); font-weight: 700; letter-spacing: -0.015em; color: var(--ink);
      line-height: 1.4; scroll-margin-top: 80px;
    }
    .content h1 { font-size: 24px; margin: 40px 0 14px; }
    .content h2 {
      font-size: 20px; margin: 40px 0 14px; padding-left: 12px;
      border-left: 3px solid var(--accent);
    }
    .content h3 { font-size: 16.5px; margin: 30px 0 10px; }
    .content p { margin: 0 0 18px; }
    .content ul, .content ol { margin: 0 0 18px; padding-left: 1.4em; }
    .content li { margin-bottom: 7px; }
    .content li::marker { color: var(--accent); }
    .content a {
      color: var(--ink); border-bottom: 1px solid var(--accent);
      padding-bottom: 1px; transition: 0.18s ease;
    }
    .content a:hover { color: var(--accent); }
    .content strong { font-weight: 700; color: var(--ink); }
    .content code {
      font-family: var(--mono); font-size: 0.86em; letter-spacing: -0.01em;
      background: #f5f5f5; border: 1px solid #ececec; border-radius: 2px;
      padding: 1px 5px; color: #b32d2d;
    }
    .content pre {
      background: #111111; border-radius: 2px; padding: 16px 18px;
      overflow-x: auto; margin: 0 0 20px; line-height: 1.7;
      font-family: var(--mono); font-size: 12.5px; color: #e6e6e6;
    }
    .content pre code { background: none; border: 0; padding: 0; color: inherit; font-size: inherit; }
    .content blockquote {
      margin: 0 0 20px; padding: 12px 16px;
      border-left: 2px solid var(--accent); background: var(--bg-soft);
      font-size: 14.5px; color: var(--ink-soft);
    }
    .content blockquote p:last-child { margin-bottom: 0; }
    .content hr { border: 0; border-top: 1px solid var(--line); margin: 32px 0; }
    .table-wrap { overflow-x: auto; margin: 0 0 20px; }
    .content table { width: 100%; border-collapse: collapse; font-family: var(--sans); font-size: 13px; }
    .content th {
      text-align: left; font-family: var(--mono); font-size: 10px; letter-spacing: 0.1em;
      text-transform: uppercase; color: var(--ink);
      background: var(--bg-soft); border-bottom: 1px solid var(--ink); padding: 9px 11px;
    }
    .content td { border-bottom: 1px solid var(--line); padding: 9px 11px; color: var(--ink-soft); }
    .content tr:last-child td { border-bottom: 1px solid var(--ink); }
    .content tr:hover td { background: #fcfcfc; }
    .content img {
      max-width: 100%; height: auto; display: block; margin: 6px 0 20px;
      border: 1px solid var(--line); border-radius: 2px;
    }

    /* ── 源文件链接 ── */
    .source-raw-btn {
      display: inline-flex; align-items: center; gap: 7px;
      font-family: var(--mono); font-size: 11px; letter-spacing: 0.06em; color: var(--ink-soft);
      border: 1px solid var(--line); border-radius: 2px; padding: 8px 13px; transition: 0.2s ease;
    }
    .source-raw-btn:hover { border-color: var(--ink); color: var(--ink); }

    .loading-spinner {
      font-family: var(--mono); font-size: 12px; letter-spacing: 0.06em; color: var(--muted);
      padding: 30px 0;
    }

    footer {
      margin-top: 46px; padding-top: 16px; border-top: 1px solid var(--ink);
      font-family: var(--mono); font-size: 10px; letter-spacing: 0.07em; color: var(--muted);
    }

    @media (min-width: 900px) { body { padding: 0 32px 80px; } }
  </style>
</head>
<body>

  <div class="container">
    <!-- 顶部导航 -->
    <nav class="top-nav">
      <a class="back-btn" href="index.html">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        返回首页
      </a>
      <span style="font-size: 13px; color: var(--text-muted);">T大帅的个人博客</span>
    </nav>

    <!-- 文章正文 -->
    <main class="article-box">
      <div class="meta-bar">
        <span class="badge" id="post-badge">博文精选</span>
        <span id="post-date">博文归档</span>
        <span>· 作者：T大帅</span>
      </div>

      <header class="article-header">
        <h1 id="post-title">正在加载文章内容...</h1>
      </header>

      <div class="content" id="article-content">
        <div class="loading-spinner">⏳ 正在读取 Markdown 文章，请稍候...</div>
      </div>

      <div style="border-top: 1px solid var(--border-color); margin-top: 36px; padding-top: 20px;">
        <a class="source-raw-btn" id="raw-link" href="#" target="_blank">
          📄 查看原始 Markdown 源文件
        </a>
      </div>
    </main>

    <footer>
      <p>© 2026 T大帅 · 基于 GitHub Pages 构建</p>
    </footer>
  </div>

  <script>
    (function loadArticle() {
      const urlParams = new URLSearchParams(window.location.search);
      const rawFile = urlParams.get('file') || 'README.md';

      // 设置源文件链接
      document.getElementById('raw-link').href = rawFile;

      // 动态获取并解析 Markdown，安全进行 URL 编码并加入时间戳防缓存
      const fetchTarget = encodeURI(rawFile) + '?_t=' + new Date().getTime();

      fetch(fetchTarget)
        .then(res => {
          if (!res.ok) throw new Error('HTTP ' + res.status);
          return res.text();
        })
        .then(mdText => {
          if (!mdText || mdText.trim().length === 0) {
            document.getElementById('article-content').innerHTML = '<p>文章内容为空。</p>';
            return;
          }
          renderMarkdown(mdText);
        })
        .catch(err => {
          document.getElementById('article-content').innerHTML = 
            '<p style="color: #b91c1c; padding: 20px; background: #fee2e2; border-radius: 8px;">⚠️ 文章加载失败：' + err.message + '。<br><span style="font-size:13px;color:#7f1d1d;">请确认文件路径：' + escapeHtml(rawFile) + ' 是否存在。</span></p>';
        });

      function renderMarkdown(md) {
        const lines = md.split('\n');
        let html = '';
        let inList = false;
        let inCodeBlock = false;
        let codeBlockContent = '';
        let titleFound = false;
        let inTable = false;
        let tableHeaderDone = false;

        for (let i = 0; i < lines.length; i++) {
          let line = lines[i];
          let trimmed = line.trim();

          // 处理代码块 ```
          if (trimmed.startsWith('```')) {
            if (inCodeBlock) {
              html += '<pre><code>' + escapeHtml(codeBlockContent.trimEnd()) + '</code></pre>';
              codeBlockContent = '';
              inCodeBlock = false;
            } else {
              closeListAndTable();
              inCodeBlock = true;
            }
            continue;
          }
          if (inCodeBlock) {
            codeBlockContent += line + '\n';
            continue;
          }

          // 处理 Markdown 表格 (| col | col |)
          if (trimmed.startsWith('|') && trimmed.endsWith('|')) {
            // 分隔线 (| --- | --- |)
            if (/^\|[\s\-:|]+\|$/.test(trimmed)) {
              tableHeaderDone = true;
              continue;
            }
            if (!inTable) {
              closeList();
              html += '<div class="table-wrap"><table>';
              inTable = true;
              tableHeaderDone = false;
            }

            const cells = trimmed.slice(1, -1).split('|').map(c => c.trim());
            const tag = tableHeaderDone ? 'td' : 'th';
            const rowHtml = '<tr>' + cells.map(c => `<${tag}>${formatInline(c)}</${tag}>`).join('') + '</tr>';

            if (!tableHeaderDone) {
              html += '<thead>' + rowHtml + '</thead><tbody>';
            } else {
              html += rowHtml;
            }
            continue;
          } else {
            if (inTable) {
              html += '</tbody></table></div>';
              inTable = false;
              tableHeaderDone = false;
            }
          }

          // 分割线 ---
          if (trimmed === '---' || trimmed === '***') {
            closeList();
            html += '<hr>';
            continue;
          }

          // 空行处理
          if (!trimmed) {
            closeList();
            continue;
          }

          // 一级标题
          if (trimmed.startsWith('# ')) {
            closeList();
            const title = trimmed.replace(/^#\s+/, '').trim();
            if (!titleFound) {
              document.getElementById('post-title').innerText = title;
              document.title = title + ' | T大帅';
              titleFound = true;
              continue;
            } else {
              html += '<h1>' + formatInline(title) + '</h1>';
              continue;
            }
          }

          // 二级标题
          if (trimmed.startsWith('## ')) {
            closeList();
            html += '<h2>' + formatInline(trimmed.replace(/^##\s+/, '')) + '</h2>';
            continue;
          }

          // 三级标题
          if (trimmed.startsWith('### ')) {
            closeList();
            html += '<h3>' + formatInline(trimmed.replace(/^###\s+/, '')) + '</h3>';
            continue;
          }

          // 四级标题
          if (trimmed.startsWith('#### ')) {
            closeList();
            html += '<h4>' + formatInline(trimmed.replace(/^####\s+/, '')) + '</h4>';
            continue;
          }

          // 列表项
          if (trimmed.startsWith('- ') || trimmed.startsWith('* ')) {
            if (!inList) { html += '<ul>'; inList = true; }
            html += '<li>' + formatInline(trimmed.replace(/^[-*]\s+/, '')) + '</li>';
            continue;
          }

          // 引用块
          if (trimmed.startsWith('> ')) {
            closeList();
            html += '<blockquote>' + formatInline(trimmed.replace(/^>\s+/, '')) + '</blockquote>';
            continue;
          }

          // 普通段落
          closeList();
          html += '<p>' + formatInline(trimmed) + '</p>';
        }

        closeListAndTable();
        document.getElementById('article-content').innerHTML = html;

        function closeList() {
          if (inList) { html += '</ul>'; inList = false; }
        }
        function closeListAndTable() {
          if (inList) { html += '</ul>'; inList = false; }
          if (inTable) { html += '</tbody></table></div>'; inTable = false; }
        }
      }

      function escapeHtml(str) {
        return str
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;');
      }

      function formatInline(str) {
        return str
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/!\[(.*?)\]\((.*?)\)/g, '<img src="$2" alt="$1">')
          .replace(/\[(.*?)\]\((.*?)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
          .replace(/`([^`]+)`/g, '<code>$1</code>')
          .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
          .replace(/\*(.*?)\*/g, '<em>$1</em>');
      }
    })();
  </script>
</body>
</html>
